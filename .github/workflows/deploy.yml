name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/samex-26/pagosya-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag del commit
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir la imagen
        run: |
          docker build --build-arg APP_VERSION=${{ steps.vars.outputs.tag }} \
            -t ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }} app/

      - name: Levantar el contenedor
        run: |
          docker run -d --name pagosya-api -p 8080:8000 \
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/ >/dev/null 2>&1; then
              echo "OK ${{ steps.vars.outputs.tag }}"
              exit 0
            fi
            sleep 0.5
          done
          echo "smoke falló con ${{ steps.vars.outputs.tag }}" >&2
          docker logs pagosya-api
          exit 1

      - name: Publicar imagen (solo si el smoke pasó)
        run: docker push ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
